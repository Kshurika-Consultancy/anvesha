[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anvesha-search"
version = "0.1.0"
description = "Private, self-hosted search for your own AI tools and personal projects"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kshurika Consultancy" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "idna>=3.10,<4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
anvesha = "anvesha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anvesha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
