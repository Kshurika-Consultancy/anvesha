name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev pytest
      - run: uv run --extra dev python -m anvesha.evaluation verify
      - run: uv run --extra dev python -m anvesha.review_data verify
      - run: uv run --extra dev python -m anvesha.intent_evaluation verify
      - run: uv run --extra dev python -m anvesha.llm_evaluation verify
      - run: uv run --extra dev python -m anvesha.ranking_experiment verify
      - run: uv run --extra dev python scripts/smoke_mvp.py
      - run: uv run --extra dev python scripts/smoke_selfhost.py
      - run: uv run --extra dev python scripts/smoke_retention.py
      - run: uv run --extra dev python scripts/check_tracking.py
      - run: git diff --check
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          python-version: "3.12"
      - run: uv run --extra dev python scripts/smoke_container.py
